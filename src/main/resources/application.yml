app:
  token:
    secret: secretKeyRahatAliCognizantSecretKeyForAuthServices808756
server:
  address: 0.0.0.0
  port: 8086 # API Gateway port

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true # For case-insensitive service names
      default-filters:
        -name: RewriteResponseStatus
        args:
          OriginalStatusCoderHeaderName: X-Original-State


      routes:
        # Routes For Auth Service
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /${segment}
      # Actuator Routes for Auth Service
        - id: auth-service-actuator
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/actuator/**
          filters:
            - RewritePath=/auth-service/actuator/(?<segment>.*), /actuator/${segment}
      #Routes For Bookmark Service
        - id: bookmark-service
          uri: lb://BOOKMARK-SERVICE
          predicates:
            - Path=/bookmark-service/**
          filters:
            - RewritePath=/bookmark-service/(?<segment>.*), /${segment}
       # Actuator Routes for Bookmark Service
        - id: bookmark-service-actuator
          uri: lb://BOOKMARK-SERVICE
          predicates:
            - Path=/bookmark-service/actuator/**
          filters:
            - RewritePath=/bookmark-service/actuator/(?<segment>.*), /actuator/${segment}
       #Routes for User Profile Service
        - id: user-service
          uri: lb://USERPROFILE-SERVICE
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER}
    register-with-eureka : true
    fetch-registry : true
  instance:
    prefer-ip-address: true

  logging:
      level:
        org:
          springframework:
            cloud:
              openfeign: DEBUG
      feign: DEBUG

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000





